name: Release checks

# Reusable only: ordinary branch pushes and PRs deliberately do not start CI.
on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.22.x"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go vet ./...
      - run: go test ./... -count=1 -race
        if: runner.os == 'Linux'
      - run: go test ./... -count=1
        if: runner.os != 'Linux'
      - name: Vet documentation generator
        working-directory: tools/docs
        run: go vet ./...
      - name: Test documentation generator
        working-directory: tools/docs
        run: go test ./... -count=1
      - name: Test release guard
        run: node --test .github/scripts/release-guard.test.cjs
      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh build-all.sh
