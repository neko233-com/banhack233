name: Release and documentation
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# Serialize releases; never interrupt an in-progress upload or Pages deployment.
concurrency:
  group: release-and-documentation
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    name: Validate stable release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: guard
        with:
          script: |
            const guard = require('./.github/scripts/release-guard.cjs');
            await guard({github, context, core});
      - name: Require release notes
        if: steps.guard.outputs.publish == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: test -s "docs/releases/${TAG}.md"

  checks:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: [gate, checks]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      published: ${{ steps.current.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build binaries and HTML from the release commit
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          DATE="$(git show -s --format=%cI HEAD)"
          export DATE
          sh build-all.sh
          (
            cd tools/docs
            go run . -version "$VERSION" -commit "$COMMIT" -date "$DATE"
          )
          tar -czf "dist/banhack233-docs-${VERSION}.tar.gz" -C site .
          (
            cd dist
            sha256sum banhack233-linux-* banhack233-darwin-* banhack233-windows-*.exe \
              "banhack233-docs-${VERSION}.tar.gz" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - name: Recheck latest version and tag before publishing
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const guard = require('./.github/scripts/release-guard.cjs');
            await guard({github, context, core});
      - name: Upload the versioned Pages artifact
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 7
      - name: Upload assets before publishing the Release
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes-file "docs/releases/${TAG}.md"
          fi
          gh release upload "$TAG" \
            dist/banhack233-linux-* dist/banhack233-darwin-* dist/banhack233-windows-*.exe \
            "dist/banhack233-docs-${TAG}.tar.gz" dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest --title "$TAG" \
            --notes-file "docs/releases/${TAG}.md"

  deploy-docs:
    name: Deploy published documentation
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prevent old retries from replacing current documentation
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const guard = require('./.github/scripts/release-guard.cjs');
            await guard({github, context, core, requirePublished: true});
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.current.outputs.publish == 'true'
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        if: steps.current.outputs.publish == 'true'
